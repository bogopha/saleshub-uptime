# 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 꺼진다(GitHub 문서). 매달 1일 작은 기록을 남겨 계속 돌게 한다.
name: keepalive
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive && git commit -m 'keepalive' && git push
